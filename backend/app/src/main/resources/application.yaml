spring:
  application:
    name: llm-router
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

application:
  security:
    enabled: ${SECURITY_ENABLED:false}
    jwt:
      audience: ${KEYCLOAK_AUDIENCE:llm-router}
    api-key: ${ROUTER_API_KEY:}
  cache:
    enabled: ${ROUTER_CACHE_ENABLED:true}
    ttl-seconds: ${ROUTER_CACHE_TTL:3600}
  gateway:
    connect-timeout-ms: ${GATEWAY_CONNECT_TIMEOUT:5000}
    request-timeout-ms: ${GATEWAY_REQUEST_TIMEOUT:120000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
